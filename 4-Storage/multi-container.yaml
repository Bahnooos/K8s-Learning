apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
 containers:
 - name: busybox-container-1
   image: busybox
   command: ["sleep", "36000"]
   volumeMounts:
   - name: shared-volume
     mountPath: /shared-data

 - name: busybox-container-2
   image: busybox
   command: ["sleep", "36000"]
   volumeMounts:
   - name: shared-volume
     mountPath: /shared-data

 volumes:
   - name: shared-volume
     emptyDir: {}  